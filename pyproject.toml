[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q"
markers = [
    "integration: tests that need real services/keys (GROQ_API_KEY); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["chroma_db", "documents/generated_test_documents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "chroma_db"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q"
markers = [
    "integration: tests that need real services/keys (GROQ_API_KEY); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["documents/generated_test_documents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's canonical dependency-injection pattern puts Depends(...) in
# parameter defaults; flagging it (B008) is noise for route modules.
"backend/app/api/**" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "documents/generated_test_documents"
